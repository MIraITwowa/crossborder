version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=crossborder
      - POSTGRES_USER=crossborder
      - POSTGRES_PASSWORD=crossborder123
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kafka:
    image: bitnami/kafka:latest
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DATABASE_URL=postgresql://crossborder:crossborder123@db:5432/crossborder
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BROKER_URL=kafka:9092
    depends_on:
      - db
      - redis
      - kafka

  celery:
    build: .
    command: celery -A crossborder_platform worker -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=1
      - DATABASE_URL=postgresql://crossborder:crossborder123@db:5432/crossborder
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BROKER_URL=kafka:9092
    depends_on:
      - db
      - redis
      - kafka

  celery-beat:
    build: .
    command: celery -A crossborder_platform beat -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=1
      - DATABASE_URL=postgresql://crossborder:crossborder123@db:5432/crossborder
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
